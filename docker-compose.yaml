services:

  app:
    build: ./php
    container_name: crypto_app

    volumes:
      - .:/var/www/html

    depends_on:
      - db

    environment:      
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

  nginx:
    image: nginx:alpine
    container_name: reverse_proxy

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: mysql_db

    restart: always

    ports:
      - "3306:3306"

    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

  adminer:
    image: adminer
    container_name: adminer

    restart: always

    ports:
      - "8081:8080"

    depends_on:
      - db

volumes:
  mysql_data: