<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Crypto | Página de Teste</title>
    <link rel="shortcut icon" href="http://www.crypto.com/favicon.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.0/css/all.min.css" integrity="sha512-AyOHI/tIMgoG+32apAs3OdqFowPSDqiz5vLcD2wdhBJ4J/xF1PI6UITcyhS5HCmsiioapRaONqYBvimxzFfnoA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="http://www.crypto.com/css/test.css">
    <link rel="stylesheet" href="http://www.crypto.com/css/toast.css">
    <script defer src="http://www.crypto.com/js/promisses.js"></script>
    <script defer src="http://www.crypto.com/js/toast.js"></script>
    <script defer src="http://www.crypto.com/js/test.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
</head>
<body>
    <div class="form">
        <div class="header">
            <figure class="logo">
                <img src="http://www.crypto.com/images/cryptoLogo.svg" alt="Logotipo">
            </figure>
        </div>

        <div class="main">
            <div class="field">
                <div class="icons">
                    <i class="fa fa-clock" id="time"></i>
                    <i class="fa fa-lock actived" id="lock"></i>
                    <i class="fa fa-lock-open" id="unlock"></i>
                </div>
                <textarea cols="30" rows="6" name="text" id="text" placeholder="Coloque o texto aqui | Limite de caracteres 255"></textarea>
            </div>

            <div class="field d-none" id="resultContainer">
                <span class="d-block">Resultado:</span>
                <p id="result"></p>
            </div>

            <div class="send">
                <button type="button" data-at="lock" data-up="static" name="go" id="go">Testar</button>
            </div>
        </div>        
    </div>
    <div id="toastLanding"></div>
</body>
</html>
